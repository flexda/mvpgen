[project]
name = "mvpgen"
version = "0.1.0"
description = "Generate runnable MVPs from a one-line idea with the Claude Agent SDK"
readme = "README.md"
authors = [
    { name = "Jiyoung Lee", email = "reflectda@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.165",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "typer>=0.27.3",
]

[project.scripts]
mvpgen = "mvpgen.cli:main"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
