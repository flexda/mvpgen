<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A1 New Museum 추천 Top 3</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800;125,900&family=Black+Han+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="newmuseum.css">
</head>
<body>
<div class="wrap">
  <header class="bar">
    <span class="mark">오늘 뭐하지</span>
    <nav class="nav"><span class="hide">전시</span><span class="hide">갤러리</span><span class="pill">10.18 SUN</span></nav>
  </header>
  <section class="hero">
    <p class="big">오늘<br>끝.</p>
    <div class="row2">
      <span class="date">10.18 SUN</span>
      <p class="lede">서울 갤러리 11곳 진행 중. 그중 <b>4개 전시가 오늘 닫힙니다.</b></p>
    </div>
  </section>
  <h2>오늘의 추천</h2>
  <div class="picks" id="picks"></div>
  <h2>진행 중 전시</h2>
  <div id="groups"></div>
  <footer>
    <span>갤러리 정보 기준일 <b>2026-10-06</b></span>
    <span>국립현대미술관 · 마지막 동기화 기록 없음</span>
    <button type="button">MMCA 동기화</button>
  </footer>
</div>
<script src="data.js"></script>
<script src="logic.js"></script>
<script>
  const chipsFor = (x) => badges(x).length ? '<span class="chips">' + badges(x).map((b) => '<span class="chip blue">' + b + "</span>").join("") + "</span>" : "";
  const dA = (x) => '<span class="d' + (x.days === 0 ? " today" : "") + '">' + dLabel(x.days) + "</span>";
  const rowA = (x) => '<a class="r" href="#/exhibitions/' + x.id + '"><span class="t">' + esc(x.title) + "</span>" + dA(x) +
    '<span class="m">' + esc(x.artists) + " · " + esc(place(x)) + " · " + period(x) + "</span>" + chipsFor(x) + "</a>";
  document.getElementById("picks").innerHTML = top3().map((x) =>
    '<a class="pick" href="#/exhibitions/' + x.id + '"><span class="n">0' + x.top3 + '</span><span class="t">' + esc(x.title) + "</span>" +
    '<span class="m">' + esc(x.artists) + "<br>" + esc(place(x)) + "</span>" +
    '<span class="chips"><span class="chip solid">' + (x.days === 0 ? "오늘 종료" : x.days + "일 후 종료") + "</span>" +
    (x.review ? '<span class="chip blue">정보 확인 필요</span>' : '<span class="chip">정보 확인됨</span>') + "</span></a>").join("");
  document.getElementById("groups").innerHTML = GROUPS.map((g) => {
    const xs = byDays(EXHIBITIONS.filter(g.f));
    return '<section class="group"><h3>' + g.en + " " + xs.length + "<small>" + g.ko + '</small></h3><div class="rows">' + xs.map(rowA).join("") + "</div></section>";
  }).join("");
</script>
</body>
</html>
